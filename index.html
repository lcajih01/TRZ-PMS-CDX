<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#053d25" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TRZ PMS" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icons/icon-192x192.svg" />
    <title>TRZ PMS Phase 1</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <strong>TRZ PMS</strong>
        <span>Phase 1 Foundation</span>
      </div>
      <div id="userBadge" class="user-badge"></div>
    </header>

    <main>
      <nav class="tabs" id="tabs"></nav>
      <section id="statusMessage" class="message" hidden></section>
      <section id="view"></section>
    </main>

    <script src="./env.js"></script>
    <script type="module" src="./src/app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      }
    </script>
  </body>
</html>
